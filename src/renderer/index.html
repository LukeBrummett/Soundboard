<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soundboard</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="breadcrumb">
        <button id="home-btn" class="control-btn home-button" title="Home (Ctrl+H)">Home</button>
      </div>
      <div class="controls">
        <button id="delete-grid-btn" class="control-btn" title="Delete Current Grid" style="display: none;">🗑️</button>
        <button id="lock-btn" class="control-btn" title="Lock/Unlock Grid (Ctrl+L)">🔓</button>
        <button id="settings-btn" class="control-btn" title="Settings">⚙️</button>
        <button id="add-grid-btn" class="control-btn" title="Add New Grid">➕</button>
      </div>
    </div>

    <!-- Main Grid Container -->
    <div id="grid-container" class="grid-container">
      <div id="grid" class="grid"></div>
      
      <!-- Stream Deck Frames Overlay -->
      <div id="stream-deck-frames" class="stream-deck-frames"></div>
    </div>

    <!-- Context Menu -->
    <div id="context-menu" class="context-menu hidden">
      <div class="context-menu-item" data-action="paste" id="paste-item" style="display: none;">📄 Paste Button</div>
      <div class="context-menu-separator" id="paste-separator" style="display: none;"></div>
      <div class="context-menu-item" data-action="edit">✏️ Edit Button</div>
      <div class="context-menu-item" data-action="copy">📋 Copy Button</div>
      <div class="context-menu-item" data-action="delete">🗑️ Delete Button</div>
      <div class="context-menu-separator" id="add-separator"></div>
      <div class="context-menu-item" data-action="add-sound">🎵 Add Sound</div>
      <div class="context-menu-item" data-action="add-navigate">📁 Add Navigation</div>
    </div>

    <!-- Modal for Button Editor -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title">Edit Button</h2>
          <button id="modal-close" class="modal-close">✕</button>
        </div>
        <div class="modal-body" id="modal-body">
          <!-- Dynamic content will be inserted here -->
        </div>
      </div>
    </div>
  </div>

  <script src="../../node_modules/howler/dist/howler.min.js"></script>
  <script src="audio.js"></script>
  <script src="grid.js"></script>
  <script src="app.js"></script>
</body>
</html>
